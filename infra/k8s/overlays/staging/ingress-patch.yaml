apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carelens
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - carelens-demo-mriganka.indiasouthcentral.cloudapp.azure.com
      secretName: carelens-tls
  rules:
    - host: carelens-demo-mriganka.indiasouthcentral.cloudapp.azure.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
