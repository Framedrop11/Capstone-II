apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: carelens
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: carelens
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: carelens
        carelens.io/role: mongo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-replica-key
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - cp /source/keyfile /target/keyfile && chmod 0400 /target/keyfile
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: replica-key-source
              mountPath: /source
              readOnly: true
            - name: replica-key
              mountPath: /target
      containers:
        - name: mongodb
          image: mongo:7.0.22
          imagePullPolicy: IfNotPresent
          args: [mongod, --bind_ip_all, --replSet, rs0, --keyFile, /etc/mongo-keyfile/keyfile]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: HOME
              value: /tmp
          ports:
            - name: mongo
              containerPort: 27017
          startupProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: replica-key
              mountPath: /etc/mongo-keyfile
              readOnly: true
      volumes:
        - name: replica-key-source
          secret:
            secretName: carelens-runtime
            items:
              - key: MONGO_REPLICA_KEYFILE
                path: keyfile
            defaultMode: 0400
        - name: replica-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 16Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-replica-init
data:
  initialize.js: |
    try {
      rs.status();
      print('Replica set is already initialized');
    } catch (error) {
      if (error.code === 94 || error.codeName === 'NotYetInitialized') {
        rs.initiate({
          _id: 'rs0',
          members: [{ _id: 0, host: 'mongodb-0.mongodb-headless.carelens.svc.cluster.local:27017' }]
        });
      } else {
        throw error;
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replica-init
  labels:
    app.kubernetes.io/name: mongodb-replica-init
    app.kubernetes.io/part-of: carelens
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-replica-init
        app.kubernetes.io/part-of: carelens
        carelens.io/role: database-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: mongo:7.0.22
          command: [bash, -ec]
          args:
            - |
              for attempt in $(seq 1 60); do
                if mongosh --quiet --host mongodb-0.mongodb-headless.carelens.svc.cluster.local \
                  --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
                  --authenticationDatabase admin --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              mongosh --quiet --host mongodb-0.mongodb-headless.carelens.svc.cluster.local \
                --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
                --authenticationDatabase admin /scripts/initialize.js
              for attempt in $(seq 1 60); do
                if mongosh --quiet --host mongodb-0.mongodb-headless.carelens.svc.cluster.local \
                  --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
                  --authenticationDatabase admin --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
                  exit 0
                fi
                sleep 2
              done
              echo 'MongoDB replica set did not become primary before timeout' >&2
              exit 1
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: MONGO_INITDB_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: init-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init-script
          configMap:
            name: mongodb-replica-init
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
