apiVersion: apps/v1
kind: Deployment
metadata:
  name: carelens-cloudflared
  labels:
    app.kubernetes.io/name: carelens-cloudflared
    app.kubernetes.io/part-of: carelens
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: carelens-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carelens-cloudflared
        app.kubernetes.io/part-of: carelens
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "2000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: carelens-cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.0
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: carelens-cloudflared
  labels:
    app.kubernetes.io/name: carelens-cloudflared
    app.kubernetes.io/part-of: carelens
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carelens-cloudflared
