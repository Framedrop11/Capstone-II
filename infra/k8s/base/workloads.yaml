apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: carelens
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: carelens
        carelens.io/role: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      serviceAccountName: carelens
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: core-api
      containers:
        - name: core-api
          image: ghcr.io/example-org/carelens-node:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/core-api/services/core-api/src/server.js"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: carelens-runtime
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: MONGODB_URI
            - name: QUEUE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: QUEUE_REDIS_URL
            - name: CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: CACHE_REDIS_URL
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: JWT_SIGNING_SECRET
            - name: OIDC_TRANSACTION_KEY
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: OIDC_TRANSACTION_KEY
            - name: OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: OIDC_REDIRECT_URI
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: JWT_AUDIENCE
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: carelens-runtime
                  key: GOOGLE_CLIENT_SECRET
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: carelens
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
