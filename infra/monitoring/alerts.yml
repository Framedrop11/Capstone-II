groups:
  - name: carelens-availability
    rules:
      - alert: CareLensApiHighErrorRate
        expr: sum(rate(carelens_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(carelens_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Core API 5xx rate exceeds 5%
          description: Review Core API logs using the correlation ID and inspect MongoDB, Redis, and queue readiness.
      - alert: CareLensApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(carelens_http_request_duration_seconds_bucket{route!="/metrics"}[5m]))) > 0.5
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Core API p95 latency exceeds 500 ms
          description: The five-minute p95 request latency is above the questionnaire acknowledgement target.
      - alert: CareLensDependenciesDegraded
        expr: carelens_dependency_ready{dependency=~"mongo|queue_redis"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: A required Core API dependency is unavailable
          description: Check the dependency readiness metric and service logs.
      - alert: CareLensCacheUnavailable
        expr: carelens_dependency_ready{dependency="cache_redis"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Cache Redis is unavailable
          description: API cache paths should fail open; confirm degraded mode and Redis recovery.
  - name: carelens-scoring
    rules:
      - alert: CareLensQueueBacklog
        expr: carelens_worker_queue_jobs{state="waiting"} > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Scoring queue has more than 100 waiting jobs
          description: Inspect worker concurrency, MongoDB latency, and ML fallback behavior.
      - alert: CareLensScoringFallbackRateHigh
        expr: sum(rate(carelens_scoring_fallbacks_total[5m])) / clamp_min(sum(rate(carelens_worker_jobs_total{outcome="success",job_name="score-questionnaire"}[5m])), 1) > 0.10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: More than 10% of scoring jobs use the basic-only fallback
          description: Inspect ML service availability and circuit-breaker state.
      - alert: CareLensMlCircuitOpen
        expr: carelens_ml_circuit_breaker_state == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: ML circuit breaker remains open
          description: ML refinement is unavailable; basic-only screening continues.
      - alert: CareLensScoreDistributionDrift
        expr: abs((sum(rate(carelens_prediction_score_sum[5m])) / clamp_min(sum(rate(carelens_prediction_score_count[5m])), 1)) - (sum(rate(carelens_prediction_score_sum[1h])) / clamp_min(sum(rate(carelens_prediction_score_count[1h])), 1))) > 0.15 and sum(increase(carelens_prediction_score_count[5m])) >= 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Mean screening score shifted by more than 0.15
          description: Compare the recent score distribution with its one-hour baseline and review model-version traffic.
      - alert: CareLensReportCacheHitRatioLow
        expr: sum(rate(carelens_cache_operations_total{operation="read",result="hit"}[15m])) / clamp_min(sum(rate(carelens_cache_operations_total{operation="read",result=~"hit|miss"}[15m])), 0.001) < 0.20
        for: 15m
        labels: { severity: info }
        annotations:
          summary: Report and model-version cache hit ratio is below 20%
          description: Review cache TTL, invalidation frequency, and key distribution before tuning capacity.
