name: Deploy production

on:
  workflow_dispatch:
    inputs:
      node_image:
        description: Immutable GHCR Core API and worker image reference (digest)
        required: true
        type: string
      ml_image:
        description: Immutable GHCR ML image reference (digest)
        required: true
        type: string
      frontend_image:
        description: Immutable GHCR frontend image reference (digest)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: carelens-deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Validate image references
        env:
          NODE_IMAGE: ${{ inputs.node_image }}
          ML_IMAGE: ${{ inputs.ml_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          [[ "$NODE_IMAGE" =~ ^ghcr\.io/.+/carelens-node@sha256:[a-f0-9]{64}$ ]]
          [[ "$ML_IMAGE" =~ ^ghcr\.io/.+/carelens-ml@sha256:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_IMAGE" =~ ^ghcr\.io/.+/carelens-frontend@sha256:[a-f0-9]{64}$ ]]
      - name: Configure kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Set deployment image digests
        working-directory: infra/k8s/overlays/prod
        env:
          NODE_IMAGE: ${{ inputs.node_image }}
          ML_IMAGE: ${{ inputs.ml_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.5.0 edit set image "ghcr.io/example-org/carelens-node=$NODE_IMAGE" "ghcr.io/example-org/carelens-ml=$ML_IMAGE" "ghcr.io/example-org/carelens-frontend=$FRONTEND_IMAGE"
      - name: Deploy and wait for migration and rollouts
        run: |
          kubectl -n carelens delete job/database-migrate --ignore-not-found=true
          kubectl kustomize infra/k8s/overlays/prod | go run github.com/mikefarah/yq/v4@v4.45.1 eval 'select(.kind == "Namespace" or .kind == "ConfigMap" or .kind == "ServiceAccount" or (.kind == "Job" and .metadata.name == "database-migrate"))' - | kubectl apply -f -
          kubectl -n carelens wait --for=condition=complete job/database-migrate --timeout=10m
          kubectl apply -k infra/k8s/overlays/prod
          kubectl -n carelens rollout status deployment/core-api --timeout=10m
          kubectl -n carelens rollout status deployment/frontend --timeout=10m
          kubectl -n carelens rollout status deployment/worker --timeout=10m
          kubectl -n carelens rollout status deployment/ml-service --timeout=10m
      - name: Roll back application deployments after a failed release
        if: failure()
        run: |
          kubectl -n carelens rollout undo deployment/core-api || true
          kubectl -n carelens rollout undo deployment/frontend || true
          kubectl -n carelens rollout undo deployment/worker || true
          kubectl -n carelens rollout undo deployment/ml-service || true
