name: Deploy staging

on:
  workflow_run:
    workflows: [Build and deploy dev]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  deploy-and-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    services:
      selenium-chrome:
        image: selenium/standalone-chrome:4.52.0-20261101
        ports:
          - 4444:4444
        options: --shm-size=2g
      selenium-firefox:
        image: selenium/standalone-firefox:4.52.0-20261101
        ports:
          - 4445:4444
        options: --shm-size=2g
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the manifests from the same source revision that built these digests.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@v4
        with:
          name: image-digests
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: image-digests
      - name: Read immutable image references
        id: refs
        shell: bash
        run: |
          node_image="$(sed -n 's/^NODE_IMAGE=//p' image-digests/image-digests.txt)"
          ml_image="$(sed -n 's/^ML_IMAGE=//p' image-digests/image-digests.txt)"
          frontend_image="$(sed -n 's/^FRONTEND_IMAGE=//p' image-digests/image-digests.txt)"
          [[ "$node_image" =~ ^ghcr\.io/.+/carelens-node@sha256:[a-f0-9]{64}$ ]]
          [[ "$ml_image" =~ ^ghcr\.io/.+/carelens-ml@sha256:[a-f0-9]{64}$ ]]
          [[ "$frontend_image" =~ ^ghcr\.io/.+/carelens-frontend@sha256:[a-f0-9]{64}$ ]]
          {
            echo "node-image=$node_image"
            echo "ml-image=$ml_image"
            echo "frontend-image=$frontend_image"
          } >> "$GITHUB_OUTPUT"
      - name: Configure kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Set deployment image digests
        working-directory: infra/k8s/overlays/staging
        env:
          NODE_IMAGE: ${{ steps.refs.outputs.node-image }}
          ML_IMAGE: ${{ steps.refs.outputs.ml-image }}
          FRONTEND_IMAGE: ${{ steps.refs.outputs.frontend-image }}
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.5.0 edit set image "ghcr.io/example-org/carelens-node=$NODE_IMAGE" "ghcr.io/example-org/carelens-ml=$ML_IMAGE" "ghcr.io/example-org/carelens-frontend=$FRONTEND_IMAGE"
      - name: Deploy and wait
        run: |
          kubectl -n carelens delete job/database-migrate --ignore-not-found=true
          kubectl kustomize infra/k8s/overlays/staging | go run github.com/mikefarah/yq/v4@v4.45.1 eval 'select(.kind == "Namespace" or .kind == "ConfigMap" or .kind == "ServiceAccount" or (.kind == "Job" and .metadata.name == "database-migrate"))' - | kubectl apply -f -
          kubectl -n carelens wait --for=condition=complete job/database-migrate --timeout=10m
          kubectl apply -k infra/k8s/overlays/staging
          kubectl -n carelens rollout status deployment/core-api --timeout=5m
          kubectl -n carelens rollout status deployment/frontend --timeout=5m
          kubectl -n carelens rollout status deployment/worker --timeout=5m
          kubectl -n carelens rollout status deployment/ml-service --timeout=5m
      - name: Run API health smoke
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          test -n "$BASE_URL"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/healthz"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/readyz"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/config.js"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run staging browser smoke on Chrome and Firefox, desktop and mobile
        env:
          CARELENS_E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          CARELENS_E2E_PUBLIC_ONLY: "true"
          SELENIUM_CHROME_URL: http://localhost:4444
          SELENIUM_FIREFOX_URL: http://localhost:4445
        run: npm run fe:e2e
      - name: Run k6 smoke profile
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: docker run --rm -e BASE_URL="$BASE_URL" -v "$PWD/tests/load:/scripts:ro" grafana/k6:0.54.0 run /scripts/staging-smoke.js
      - name: Run ZAP baseline scan
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: docker run --rm -v "$RUNNER_TEMP:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$BASE_URL" -J zap-baseline.json
      - name: Roll back application deployments after a failed release
        if: failure()
        run: |
          kubectl -n carelens rollout undo deployment/core-api || true
          kubectl -n carelens rollout undo deployment/frontend || true
          kubectl -n carelens rollout undo deployment/worker || true
          kubectl -n carelens rollout undo deployment/ml-service || true
