name: Basic CI Checks

on:
  pull_request:
    branches: [demo-rc]
  push:
    branches: [demo-rc]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run fe:build
