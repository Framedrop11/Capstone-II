name: Build and deploy dev

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      node-image: ${{ steps.digests.outputs.node-image }}
      ml-image: ${{ steps.digests.outputs.ml-image }}
      frontend-image: ${{ steps.digests.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Set image names
        id: names
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "node=ghcr.io/${owner}/carelens-node"
            echo "ml=ghcr.io/${owner}/carelens-ml"
            echo "frontend=ghcr.io/${owner}/carelens-frontend"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build Core API and worker image
        run: docker build -f infra/docker/node-service.Dockerfile -t "${{ steps.names.outputs.node }}:sha-${GITHUB_SHA}" .
      - name: Scan Core API and worker image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.names.outputs.node }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build ML image
        run: docker build -f services/ml-service/Dockerfile -t "${{ steps.names.outputs.ml }}:sha-${GITHUB_SHA}" .
      - name: Scan ML image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.names.outputs.ml }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "${{ steps.names.outputs.frontend }}:sha-${GITHUB_SHA}" .
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.frontend }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in and publish images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_IMAGE: ${{ steps.names.outputs.node }}
          ML_IMAGE: ${{ steps.names.outputs.ml }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$NODE_IMAGE:sha-$GITHUB_SHA"
          docker push "$ML_IMAGE:sha-$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker tag "$NODE_IMAGE:sha-$GITHUB_SHA" "$NODE_IMAGE:$GITHUB_REF_NAME"
            docker tag "$ML_IMAGE:sha-$GITHUB_SHA" "$ML_IMAGE:$GITHUB_REF_NAME"
            docker push "$NODE_IMAGE:$GITHUB_REF_NAME"
            docker push "$ML_IMAGE:$GITHUB_REF_NAME"
            docker tag "$FRONTEND_IMAGE:sha-$GITHUB_SHA" "$FRONTEND_IMAGE:$GITHUB_REF_NAME"
            docker push "$FRONTEND_IMAGE:$GITHUB_REF_NAME"
          fi
      - name: Record immutable image references
        id: digests
        env:
          NODE_IMAGE: ${{ steps.names.outputs.node }}
          ML_IMAGE: ${{ steps.names.outputs.ml }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}
        run: |
          node_digest="$(docker buildx imagetools inspect "$NODE_IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          ml_digest="$(docker buildx imagetools inspect "$ML_IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "$FRONTEND_IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          {
            echo "node-image=$NODE_IMAGE@$node_digest"
            echo "ml-image=$ML_IMAGE@$ml_digest"
            echo "frontend-image=$FRONTEND_IMAGE@$frontend_digest"
          } >> "$GITHUB_OUTPUT"
          printf 'NODE_IMAGE=%s@%s\nML_IMAGE=%s@%s\nFRONTEND_IMAGE=%s@%s\n' "$NODE_IMAGE" "$node_digest" "$ML_IMAGE" "$ml_digest" "$FRONTEND_IMAGE" "$frontend_digest" > image-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.txt
          retention-days: 30

  deploy-dev:
    needs: build-scan-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: carelens-deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Configure kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Set deployment image digests
        working-directory: infra/k8s/overlays/dev
        env:
          NODE_IMAGE: ${{ needs.build-scan-publish.outputs.node-image }}
          ML_IMAGE: ${{ needs.build-scan-publish.outputs.ml-image }}
          FRONTEND_IMAGE: ${{ needs.build-scan-publish.outputs.frontend-image }}
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.5.0 edit set image "ghcr.io/example-org/carelens-node=$NODE_IMAGE" "ghcr.io/example-org/carelens-ml=$ML_IMAGE" "ghcr.io/example-org/carelens-frontend=$FRONTEND_IMAGE"
      - name: Apply manifests and wait for migration
        run: |
          kubectl -n carelens delete job/database-migrate --ignore-not-found=true
          kubectl kustomize infra/k8s/overlays/dev | go run github.com/mikefarah/yq/v4@v4.45.1 eval 'select(.kind == "Namespace" or .kind == "ConfigMap" or .kind == "ServiceAccount" or (.kind == "Job" and .metadata.name == "database-migrate"))' - | kubectl apply -f -
          kubectl -n carelens wait --for=condition=complete job/database-migrate --timeout=10m
          kubectl apply -k infra/k8s/overlays/dev
          kubectl -n carelens rollout status deployment/core-api --timeout=5m
          kubectl -n carelens rollout status deployment/frontend --timeout=5m
          kubectl -n carelens rollout status deployment/worker --timeout=5m
          kubectl -n carelens rollout status deployment/ml-service --timeout=5m
      - name: Roll back application deployments after a failed release
        if: failure()
        run: |
          kubectl -n carelens rollout undo deployment/core-api || true
          kubectl -n carelens rollout undo deployment/frontend || true
          kubectl -n carelens rollout undo deployment/worker || true
          kubectl -n carelens rollout undo deployment/ml-service || true
