name: Kind cluster proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/k8s/kind/**"
      - ".github/workflows/kind-cluster-proof.yml"

permissions:
  contents: read

concurrency:
  group: kind-cluster-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  three-node-resilience:
    name: Three-node Kind worker interruption
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create three-node Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: carelens-demo
          config: infra/k8s/kind/cluster.yaml
          node_image: kindest/node:v1.32.2
          kubectl_version: v1.32.2
          wait: 120s
      - name: Show cluster nodes
        run: |
          kubectl get nodes -o wide
          test "$(kubectl get nodes --no-headers | wc -l)" -eq 3
      - name: Deploy disposable stateless workload
        run: |
          kubectl apply -f infra/k8s/kind/resilience-demo.yaml
          kubectl rollout status deployment/resilience-demo --timeout=180s
          kubectl get pods -l app=resilience-demo -o wide
      - name: Stop one worker container and observe recovery
        run: |
          docker stop carelens-demo-worker
          if kubectl wait --for=condition=Ready node/carelens-demo-worker --timeout=45s; then
            echo "Stopped worker unexpectedly remained Ready" >&2
            exit 1
          fi
          kubectl rollout status deployment/resilience-demo --timeout=240s
          kubectl get nodes -o wide
          kubectl get pods -l app=resilience-demo -o wide
          test "$(kubectl get deployment resilience-demo -o jsonpath='{.status.availableReplicas}')" -eq 3
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl describe deployment resilience-demo || true
          kubectl get events --sort-by=.lastTimestamp || true
