name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "infra/docker/**"
      - "infra/k8s/**"
      - "frontend/Dockerfile"
      - "services/core-api/openapi/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/docker/**"
      - "infra/k8s/**"
      - "frontend/Dockerfile"
      - "services/core-api/openapi/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend client, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fe:verify
      - name: Fail when generated OpenAPI client drifted
        run: git diff --exit-code -- frontend/src/shared/api/schema.d.ts

  frontend-image:
    name: Build and scan frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: carelens-frontend:ci
          load: true
      - name: Scan frontend container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: carelens-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  frontend-e2e:
    name: Local full-stack Selenium matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_PROVIDER: mock
      FRONTEND_PUBLIC_URL: http://frontend:8080
      FRONTEND_HOST_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Start full CareLens stack and Selenium browsers
        run: docker compose -f infra/docker/docker-compose.yml --profile e2e up --build -d
      - name: Wait for the full stack
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null && curl --fail --silent http://localhost:3000/readyz >/dev/null; then break; fi
            sleep 5
          done
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:3000/readyz
          curl --fail http://localhost:4444/status
          curl --fail http://localhost:4445/status
      - name: Seed synthetic local demo identities
        run: docker compose -f infra/docker/docker-compose.yml exec -T core-api node scripts/seed-local.mjs
      - name: Run patient, doctor and admin browser story
        env:
          CARELENS_E2E_BASE_URL: http://frontend:8080
          SELENIUM_CHROME_URL: http://localhost:4444
          SELENIUM_FIREFOX_URL: http://localhost:4445
        run: npm run fe:e2e
      - name: Collect failed container logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml --profile e2e logs --no-color > frontend-e2e-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-e2e-compose-logs
          path: frontend-e2e-compose.log

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2.2.0
      - run: npm run fe:build
      - name: Run Lighthouse CI budgets
        run: npm run fe:lighthouse
